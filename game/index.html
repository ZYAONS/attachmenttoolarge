<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNDERSTUDY — 第 1 天（垂直切片）</title>
<style>
/* ==========================================================================
   UNDERSTUDY — 垂直切片
   没有 HUD。屏幕上所有东西都是世界里的物件：一间雨天的书房、一张桌子、
   桌上的九件东西、一个会说话的孩子、一台针式打印机。
   全部由 CSS 画成，不加载任何图片资源。
   ========================================================================== */
:root{
  --ink:#1b1712; --paper:#e7e0cf; --paper-2:#d9d0ba; --wood:#4a3527; --wood-2:#33241a;
  --lamp:#ffd79a; --lamp-dim:#c9a468; --green:#7fe08a; --crt:#0a1a0d; --bad:#a33b2f;
  --ledger:#f3ecd8; --ledger-ink:#2b2622; --ledger-ink-2:#3a2f4a;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:#0b0a09; color:var(--paper);
  font-family:"Songti SC","SimSun",Georgia,serif;
  overflow:hidden;
}
/* ---------- 房间：雨、窗、台灯 ---------- */
.room{position:fixed; inset:0; background:
  radial-gradient(120% 90% at 22% 12%, #2a2119 0%, #171310 46%, #0b0a09 100%);}
.window{
  position:absolute; left:6%; top:8%; width:34%; height:52%;
  background:linear-gradient(180deg,#1c2733 0%,#121a22 60%,#0d1319 100%);
  border:10px solid #221a13; box-shadow:0 0 60px rgba(0,0,0,.6) inset;
  overflow:hidden;
}
.window::before{ /* 窗棂 */
  content:""; position:absolute; inset:0;
  background:
    linear-gradient(90deg, transparent 48.6%, #221a13 48.6% 51.4%, transparent 51.4%),
    linear-gradient(180deg, transparent 48.6%, #221a13 48.6% 51.4%, transparent 51.4%);
}
.rain{position:absolute; inset:-20% -10%; opacity:.5;
  background:repeating-linear-gradient(101deg, rgba(190,215,235,.5) 0 1px, transparent 1px 13px);
  animation:fall 1.1s linear infinite;}
@keyframes fall{to{transform:translate(-40px,120px)}}
.street{position:absolute; left:0; right:0; bottom:0; height:26%;
  background:linear-gradient(180deg,#0e141a,#080b0e);}
.street::after{ /* 街上没有一个人 */
  content:""; position:absolute; left:8%; right:8%; bottom:34%; height:2px;
  background:linear-gradient(90deg, transparent, rgba(255,214,150,.16) 30%, rgba(255,214,150,.1) 70%, transparent);
}
.lamp{position:absolute; right:12%; top:6%; width:0; height:0;}
.lamp .shade{position:absolute; left:-90px; top:0; width:180px; height:74px;
  background:linear-gradient(180deg,#2f5a2c,#1d3a1c); border-radius:90px 90px 12px 12px;
  box-shadow:0 0 90px 30px rgba(255,215,154,.20);}
.lamp .glow{position:absolute; left:-320px; top:40px; width:640px; height:520px;
  background:radial-gradient(circle at 50% 0%, rgba(255,215,154,.34), rgba(255,215,154,.06) 42%, transparent 70%);
  pointer-events:none; mix-blend-mode:screen;}
/* ---------- 桌子 ---------- */
.desk{position:absolute; left:0; right:0; bottom:0; height:44%;
  background:linear-gradient(180deg,#5a4130,#3d2b1f 60%,#2a1d14);
  box-shadow:0 -30px 60px rgba(0,0,0,.5);}
.desk::before{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(92deg, rgba(0,0,0,.14) 0 2px, transparent 2px 26px);}
.deskmat{position:absolute; left:7%; bottom:9%; width:38%; height:56%;
  background:#2c231c; border:1px solid rgba(255,215,154,.14); border-radius:4px;}
/* ---------- 桌上的九件东西 ---------- */
.obj{position:absolute; cursor:pointer; transition:transform .18s, filter .18s;}
.obj:hover{transform:translateY(-4px) rotate(-1deg); filter:brightness(1.18)}
.obj:focus-visible{outline:2px solid var(--lamp); outline-offset:4px}
.obj .label{position:absolute; left:50%; transform:translateX(-50%); bottom:-20px;
  font-size:12px; color:rgba(231,224,207,.5); white-space:nowrap; font-family:ui-monospace,monospace}
.obj.found .label{color:var(--green)}
.obj.found::after{content:"✓"; position:absolute; top:-14px; right:-10px; color:var(--green); font-size:14px}

/* 日历 */
.o-cal{left:9%; bottom:24%; width:104px; height:78px; background:var(--paper);
  border-top:10px solid #7c3b2c; box-shadow:0 6px 14px rgba(0,0,0,.5); transform:rotate(-2deg)}
.o-cal i{position:absolute; inset:12px 10px; font-style:normal; color:#3a322a; font-size:13px; line-height:1.3}
.o-cal i b{display:block; font-size:22px; font-family:ui-monospace,monospace; color:#7c3b2c}
/* 旧照片 */
.o-photo{left:23%; bottom:34%; width:96px; height:70px; background:#cfc4ad; padding:5px 5px 16px;
  box-shadow:0 5px 12px rgba(0,0,0,.5); transform:rotate(3deg)}
.o-photo u{display:block; width:100%; height:100%; background:linear-gradient(140deg,#6b7a73,#3d4a45 70%);}
/* 吉他拨片 */
.o-pick{left:36%; bottom:21%; width:26px; height:30px; background:#c9b06a;
  border-radius:60% 60% 45% 45%/70% 70% 30% 30%; box-shadow:0 3px 8px rgba(0,0,0,.55); transform:rotate(12deg)}
/* 合同草稿 */
.o-contract{left:46%; bottom:26%; width:118px; height:82px; background:#efe8d6; transform:rotate(-4deg);
  box-shadow:0 6px 14px rgba(0,0,0,.5)}
.o-contract u{position:absolute; inset:10px; background:repeating-linear-gradient(180deg,#b9b0a0 0 1px, transparent 1px 9px);}
/* 药瓶 */
.o-pills{left:59%; bottom:20%; width:34px; height:52px; background:#b9c3bd; border-radius:5px;
  box-shadow:0 4px 10px rgba(0,0,0,.5)}
.o-pills::before{content:""; position:absolute; left:0; right:0; top:-9px; height:10px; background:#8f9a94; border-radius:3px}
/* 钥匙 */
.o-keys{left:67%; bottom:30%; width:46px; height:20px; background:#8d8d8a; border-radius:10px; transform:rotate(-8deg);
  box-shadow:0 3px 8px rgba(0,0,0,.5)}
.o-keys::after{content:""; position:absolute; right:-14px; top:5px; width:16px; height:10px; background:#8d8d8a}
/* 生日卡草稿（正解 1） */
.o-card{left:16%; bottom:9%; width:104px; height:64px; background:#f6e7c8; transform:rotate(6deg);
  box-shadow:0 6px 14px rgba(0,0,0,.5)}
.o-card u{position:absolute; left:8px; right:8px; top:10px; height:1px; background:#c9a468; box-shadow:0 10px 0 #c9a468, 0 20px 0 #c9a468}
/* 蛋糕订单（正解 2） */
.o-cake{left:31%; bottom:6%; width:92px; height:70px; background:#f2f0e6; transform:rotate(-2deg);
  box-shadow:0 5px 12px rgba(0,0,0,.5); padding:8px}
.o-cake u{display:block; height:100%; background:repeating-linear-gradient(180deg,#6b6459 0 1px, transparent 1px 8px)}
/* 孩子的画（正解 3） */
.o-drawing{left:45%; bottom:5%; width:112px; height:86px; background:#fffdf3; transform:rotate(2deg);
  box-shadow:0 6px 15px rgba(0,0,0,.5)}
.o-drawing u{position:absolute; left:14px; right:14px; top:16px; bottom:20px;
  background:
    radial-gradient(circle at 24% 34%, #e0a33c 0 7px, transparent 8px),
    radial-gradient(circle at 62% 28%, #7fb0d8 0 6px, transparent 7px),
    radial-gradient(circle at 44% 62%, #c4574a 0 9px, transparent 10px),
    radial-gradient(circle at 78% 66%, #6f9e57 0 6px, transparent 7px);}
.o-drawing i{position:absolute; left:12px; bottom:6px; font-style:normal; font-family:ui-monospace,monospace;
  font-size:10px; color:#8a8172}
/* ---------- CRT（审计用） ---------- */
.crt{position:absolute; right:16%; bottom:12%; width:230px; height:172px; background:#0d0f0e;
  border:12px solid #2a2a28; border-radius:8px; box-shadow:0 10px 26px rgba(0,0,0,.6)}
.crt u{position:absolute; inset:8px; background:var(--crt); display:block; overflow:hidden;
  box-shadow:0 0 26px rgba(127,224,138,.18) inset}
.crt u::after{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(180deg, rgba(127,224,138,.09) 0 1px, transparent 1px 3px)}
.crt i{position:absolute; left:16px; top:16px; right:16px; font-style:normal; font-family:ui-monospace,monospace;
  font-size:11px; line-height:1.5; color:var(--green); white-space:pre-wrap}

/* ---------- 拿起东西看细节 ---------- */
.loupe{position:fixed; inset:0; display:none; place-items:center; z-index:20;
  background:rgba(6,5,4,.72); backdrop-filter:blur(2px)}
.loupe.on{display:grid}
.sheet{width:min(620px,88vw); background:var(--paper); color:#2a231b; padding:30px 34px; border-radius:3px;
  box-shadow:0 30px 70px rgba(0,0,0,.7); position:relative; font-size:15px; line-height:1.8}
.sheet h3{margin:0 0 4px; font-size:17px; letter-spacing:.06em}
.sheet .meta{font-family:ui-monospace,monospace; font-size:11px; color:#7b7263; margin-bottom:16px}
.sheet p{margin:0 0 12px}
.sheet .close{position:absolute; right:14px; top:12px; cursor:pointer; font-family:ui-monospace,monospace;
  font-size:12px; color:#7b7263}
.sheet .hint{font-size:13px; color:#7b7263; border-top:1px dashed #bdb3a1; padding-top:12px}

/* ---------- 会面：小满 ---------- */
.meet{position:fixed; inset:0; display:none; z-index:30; background:rgba(5,5,6,.94)}
.meet.on{display:grid; grid-template-rows:1fr auto}
.meet .frame{position:relative; margin:4vh auto 0; width:min(760px,92vw); aspect-ratio:16/9;
  background:radial-gradient(60% 60% at 50% 34%, #3a3128 0%, #171412 70%);
  border:1px solid rgba(255,215,154,.16); overflow:hidden}
.meet .kid{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:210px; height:300px;
  background:linear-gradient(180deg,#6d5b4a,#40372e); border-radius:110px 110px 0 0; opacity:.85}
.meet .kid::before{content:""; position:absolute; left:50%; top:22px; transform:translateX(-50%);
  width:104px; height:104px; border-radius:50%; background:#8b7562}
.meet .kid::after{content:""; position:absolute; left:50%; top:96px; transform:translateX(-50%);
  width:2px; height:12px; background:#3a2f27; box-shadow:-18px 0 0 #3a2f27, 18px 0 0 #3a2f27}
.meet .bubble{position:absolute; left:50%; transform:translateX(-50%); bottom:24px; width:min(620px,86%);
  background:rgba(12,10,9,.86); border:1px solid rgba(255,215,154,.18); padding:16px 20px; font-size:17px; line-height:1.6}
.meet .who{font-family:ui-monospace,monospace; font-size:11px; color:var(--lamp-dim); letter-spacing:.18em; margin-bottom:6px}
.ammo{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; padding:22px 4vw 34px}
.chip{background:rgba(231,224,207,.06); border:1px solid rgba(231,224,207,.22); color:var(--paper);
  padding:12px 18px; font-size:15px; cursor:pointer; font-family:inherit; max-width:38ch; text-align:left; line-height:1.5}
.chip:hover{background:rgba(255,215,154,.12); border-color:var(--lamp)}
.chip small{display:block; font-family:ui-monospace,monospace; font-size:10px; color:rgba(231,224,207,.45); margin-top:6px}
.chip.risky small{color:#e2a08f}

/* ---------- 信 ---------- */
.letter{position:fixed; inset:0; display:none; place-items:center; z-index:40; background:rgba(4,4,5,.92)}
.letter.on{display:grid}
.env{width:min(560px,90vw); background:#efe7d4; color:#26221c; padding:34px 36px; position:relative;
  box-shadow:0 30px 70px rgba(0,0,0,.75); font-size:16px; line-height:1.9}
.env h4{margin:0 0 18px; font-size:14px; letter-spacing:.2em; color:#8a7f6c; font-family:ui-monospace,monospace}
.env .act{display:flex; gap:14px; margin-top:26px}
.env button{flex:1; padding:12px; font-family:inherit; font-size:15px; cursor:pointer;
  background:#ded3ba; border:1px solid #b8ab90; color:#2b251d}
.env button:hover{background:#cfc2a4}

/* ---------- 审计：针式打印机 ---------- */
.audit{position:fixed; inset:0; display:none; place-items:center; z-index:50; background:rgba(3,3,4,.96)}
.audit.on{display:grid}
.printout{width:min(620px,90vw); max-height:80vh; overflow:hidden; background:var(--paper); color:#241f1a;
  padding:26px 30px; font-family:ui-monospace,monospace; font-size:13px; line-height:1.85;
  box-shadow:0 30px 70px rgba(0,0,0,.8);
  background-image:repeating-linear-gradient(180deg, rgba(0,0,0,.05) 0 1px, transparent 1px 22px),
                   repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px 12px)}
.printout b{font-weight:700}
.printout .drift{background:#e8ddc4; padding:1px 6px}
.printout .final{margin-top:14px; padding-top:12px; border-top:1px dashed #b3a992; color:#5d5140}
.printout .warn{margin-top:12px; color:var(--bad); font-weight:700}
.printout .next{margin-top:22px; text-align:center; color:#6b6152}
.printout .next button{font-family:inherit; font-size:13px; padding:9px 16px; cursor:pointer;
  background:#ded3ba; border:1px solid #b8ab90; color:#2b251d}

/* ---------- 账本（字迹系统） ---------- */
.ledger{position:fixed; right:0; top:0; bottom:0; width:min(420px,94vw); z-index:60;
  background:#141210; border-left:1px solid rgba(255,215,154,.16); transform:translateX(100%);
  transition:transform .3s; display:flex; flex-direction:column}
.ledger.on{transform:none}
.ledger .head{padding:14px 18px; border-bottom:1px solid rgba(255,215,154,.14); display:flex; align-items:baseline; gap:10px}
.ledger .head b{font-size:13px; letter-spacing:.2em; font-family:ui-monospace,monospace; color:var(--lamp-dim)}
.ledger .head span{margin-left:auto; font-family:ui-monospace,monospace; font-size:11px; color:rgba(231,224,207,.5)}
.ledger .pages{flex:1; overflow:auto; padding:18px 20px 40px; background:var(--ledger);
  background-image:repeating-linear-gradient(180deg, rgba(90,70,40,.16) 0 1px, transparent 1px 30px);
  background-position:0 14px}
.entry{margin:0 0 16px; line-height:1.65; color:var(--ledger-ink); font-size:15px; position:relative;
  transform-origin:left center}
.entry .day{font-family:ui-monospace,monospace; font-size:10px; color:#8b8371; display:block; margin-bottom:2px}
/* 字迹：三段式。他自己的手 → 混合 → 另一个人的手（斜度、抖动、墨色都变） */
.entry.his{font-family:"Xingkai SC","STXingkai","Kaiti SC",cursive; color:#26221c; transform:rotate(-.5deg)}
.entry.mixed{font-family:"Kaiti SC","STKaiti",cursive; color:#33283c; transform:rotate(-1.6deg) skewX(-3deg);
  letter-spacing:.4px}
.entry.yours{font-family:"Songti SC",serif; color:var(--ledger-ink-2); transform:rotate(2.2deg) skewX(-7deg);
  letter-spacing:1.1px; opacity:.92}
.entry.repaired::after{content:"（已加固）"; font-family:ui-monospace,monospace; font-size:10px; color:#6f8a63; margin-left:8px}
.entry.void{text-decoration:line-through; opacity:.5}
.ledger .foot{padding:12px 18px; border-top:1px solid rgba(255,215,154,.14); font-family:ui-monospace,monospace;
  font-size:11px; color:rgba(231,224,207,.55); display:flex; gap:14px; align-items:center}
.ledger .foot button{font-family:inherit; font-size:11px; padding:6px 10px; cursor:pointer;
  background:rgba(231,224,207,.08); color:var(--paper); border:1px solid rgba(231,224,207,.22)}

/* ---------- 角标 / 提示 ---------- */
.corner{position:fixed; left:22px; bottom:18px; z-index:10; font-family:ui-monospace,monospace; font-size:11px;
  color:rgba(231,224,207,.5); line-height:1.7}
.corner b{color:var(--lamp); font-weight:400}
.tools{position:fixed; right:20px; bottom:18px; z-index:10; display:flex; gap:8px}
.tools button{font-family:ui-monospace,monospace; font-size:11px; padding:7px 11px; cursor:pointer;
  background:rgba(231,224,207,.07); color:var(--paper); border:1px solid rgba(231,224,207,.2)}
.tools button:hover{border-color:var(--lamp); color:#fff}
.open-ledger{position:fixed; left:22px; top:18px; z-index:10}
.open-ledger button{font-family:ui-monospace,monospace; font-size:11px; padding:8px 12px; cursor:pointer;
  background:rgba(231,224,207,.07); color:var(--paper); border:1px solid rgba(231,224,207,.22)}
</style>
</head>
<body>

<div class="room">
  <div class="window"><div class="rain"></div><div class="street"></div></div>
  <div class="lamp"><div class="glow"></div><div class="shade"></div></div>
  <div class="desk"><div class="deskmat"></div></div>

  <!-- 桌上的九件东西。三件与女儿的生日有关。 -->
  <div class="obj o-cal"      id="cal"      role="button" tabindex="0"><i><b>11</b>三月</i><span class="label">台历</span></div>
  <div class="obj o-photo"    id="photo"    role="button" tabindex="0"><u></u><span class="label">旧照片</span></div>
  <div class="obj o-pick"     id="pick"     role="button" tabindex="0"><span class="label">拨片</span></div>
  <div class="obj o-contract" id="contract" role="button" tabindex="0"><u></u><span class="label">合同草稿</span></div>
  <div class="obj o-pills"    id="pills"    role="button" tabindex="0"><span class="label">药瓶</span></div>
  <div class="obj o-keys"     id="keys"     role="button" tabindex="0"><span class="label">钥匙</span></div>
  <div class="obj o-card"     id="card"     role="button" tabindex="0" data-birthday="1"><u></u><span class="label">生日卡草稿</span></div>
  <div class="obj o-cake"     id="cake"     role="button" tabindex="0" data-birthday="1"><u></u><span class="label">蛋糕订单</span></div>
  <div class="obj o-drawing"  id="drawing"  role="button" tabindex="0" data-birthday="1"><u></u><i>小满 画</i><span class="label">孩子的画</span></div>

  <div class="crt"><u></u><i id="crttext">U-114
验证期 第 1 天
────────────────
检索中…</i></div>
</div>

<div class="corner" id="corner">第 <b>1</b> 天 · 07:40<br>书架 · 雨<br>检索：<b id="foundcount">0</b>/3</div>
<div class="open-ledger"><button id="openledger" type="button">账本 (L)</button></div>
<div class="tools">
  <button id="sound" type="button">声音：关</button>
  <button id="driftup" type="button" title="原型用：手动推高漂移，看字迹怎么变">漂移 +20%</button>
  <button id="reset" type="button">重来</button>
</div>

<!-- 拿起东西 -->
<div class="loupe" id="loupe"><div class="sheet">
  <div class="close" id="loupeclose">关闭 ✕</div>
  <h3 id="sheet-title"></h3>
  <div class="meta" id="sheet-meta"></div>
  <div id="sheet-body"></div>
  <div class="hint" id="sheet-hint"></div>
</div></div>

<!-- 小满 -->
<div class="meet" id="meet">
  <div class="frame">
    <div class="kid"></div>
    <div class="bubble"><div class="who" id="meet-who">小满 · 11 岁</div><div id="meet-line"></div></div>
  </div>
  <div class="ammo" id="ammo"></div>
</div>

<!-- 信 -->
<div class="letter" id="letter"><div class="env">
  <h4>无寄件人 · 纸质</h4>
  <p>别找那本笔记本。<br>他们用那本笔记本训练你。</p>
  <p>你会在第 11 天开始觉得不对劲 —— 因为你弹不出来。<br>你会在第 24 天想要删掉一张发票。</p>
  <p>到那天，请你记得：<b>逃走的人是我。留下来的是你。</b></p>
  <div class="act">
    <button id="tear" type="button">撕掉</button>
    <button id="keep" type="button">收好</button>
  </div>
</div></div>

<!-- 审计 -->
<div class="audit" id="audit"><div class="printout" id="printout"></div></div>

<!-- 账本 -->
<div class="ledger" id="ledger">
  <div class="head"><b>账 本</b><span id="driftlabel">漂移 0%</span></div>
  <div class="pages" id="pages"></div>
  <div class="foot">
    <span>整理额度 <b id="budget">3</b></span>
    <button id="repair" type="button">加固最后一条</button>
    <button id="closeledger" type="button">合上</button>
  </div>
</div>

<script src="../assets/js/music.js"></script>
<script>
/* ==========================================================================
   切片逻辑。全部状态都在这里，挂在 window.__game 上以便自动化测试驱动。
   ========================================================================== */
(function () {
  "use strict";

  var STATE = {
    day: 1,
    drift: 0,
    found: [],
    entries: [],      // {day, text, kind:'his'|'mixed'|'yours', repaired, voided}
    budget: 3,
    phase: "search",  // search → meet → letter → audit → done
    qIndex: 0,
    answers: [],
    sound: false
  };

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 九件东西的内容 ---------------- */
  var OBJECTS = {
    cal: { title: "台历", meta: "纸质 · 三月", birthday: false,
      body: "<p>三月十一日这一页被人撕掉了。剩下的页边留着撕痕，撕得很整齐 —— 是提前撕的，不是匆忙撕的。</p>",
      hint: "撕得整齐，说明他早就知道这一天会缺。" },
    photo: { title: "旧照片", meta: "冲印 · 无日期", birthday: false,
      body: "<p>三个人在海边。他抱着孩子，妻子在笑，他的小指没有用力 —— 拿东西的时候，他习惯用小指抵住，而不是握住。</p>",
      hint: "记住这只手。以后有人会看你的手。" },
    pick: { title: "吉他拨片", meta: "塑料 · 有磨损", birthday: false,
      body: "<p>拨片放在书架上，积了一层灰。储物间的吉他没有弦 —— 至少三年没换过。</p>",
      hint: "「我还弹」。这句话以后会在某一天回来找你。" },
    contract: { title: "合同草稿", meta: "A4 · 未签署", birthday: false,
      body: "<p>第三页的签名栏空着。页边有一行铅笔字：<b>「他们改的是第 7 条。」</b></p>",
      hint: "第 7 条是关于什么的？柯会知道。" },
    pills: { title: "药瓶", meta: "处方药 · 已开封", birthday: false,
      body: "<p>药名被指甲刮掉了。剩余十七片，处方日期是两年前。</p>",
      hint: "两年前的药，只吃了三片。" },
    keys: { title: "钥匙", meta: "四把 · 一把没有齿痕", birthday: false,
      body: "<p>四把钥匙，其中一把是新的，没有齿痕，也没有标签。</p>",
      hint: "它开什么？档案里没有这把钥匙的记录。" },

    card: { title: "生日卡草稿", meta: "手写 · 未寄出", birthday: true,
      body: "<p>「小满：十一岁了。爸爸今年做了个很蠢的工作，但爸爸记得这一天。」</p><p>写到「记得」两个字时，笔尖停了一下，纸上留下一个墨点。</p>",
      hint: "他记得。而且他知道自己可能会忘。" },
    cake: { title: "蛋糕订单", meta: "打印小票 · 三月十日", birthday: true,
      body: "<p>六寸，草莓，不要巧克力。<b>备注：蜡烛要十一根，别放数字蜡烛，她说数字蜡烛不好看。</b></p>",
      hint: "这不是随手买的东西。这是提前一天订的。" },
    drawing: { title: "孩子的画", meta: "蜡笔 · 背面有字", birthday: true,
      body: "<p>画上三个人，中间那个头顶画了一盏灯。背面用铅笔写着：<b>「爸爸说这盏灯一直亮着。」</b></p>",
      hint: "这盏灯。就是你现在头顶这盏。" }
  };
  var BIRTHDAY = ["card", "cake", "drawing"];

  /* ---------------- 账本写入 ---------------- */
  function log(text, opts) {
    opts = opts || {};
    var e = { day: STATE.day, text: text, repaired: false, voided: false };
    STATE.entries.push(e);
    if (opts.drift) STATE.drift = Math.min(100, STATE.drift + opts.drift);
    renderLedger();
    return e;
  }

  /* 字迹：按漂移分段。这是他本人的手 → 混合 → 一个陌生人的手。 */
  function handFor() {
    if (STATE.drift < 30) return "his";
    if (STATE.drift < 65) return "mixed";
    return "yours";
  }

  function renderLedger() {
    var pages = $("pages");
    if (!pages) return;
    pages.innerHTML = STATE.entries.map(function (e, i) {
      var cls = "entry " + (i === STATE.entries.length - 1 ? handFor() : "his");
      if (e.repaired) cls += " repaired";
      if (e.voided) cls += " void";
      return '<div class="' + cls + '"><span class="day">第 ' + e.day + ' 天</span>' + e.text + "</div>";
    }).join("") || '<div class="entry his">（还没有写下任何东西）</div>';
    $("driftlabel").textContent = "漂移 " + Math.round(STATE.drift) + "%";
    $("budget").textContent = STATE.budget;
    var lbl = $("driftlabel");
    lbl.style.color = STATE.drift < 30 ? "rgba(231,224,207,.6)" : STATE.drift < 65 ? "#e0c179" : "#e2a08f";
  }

  /* ---------------- 检索 ---------------- */
  function inspect(id) {
    var o = OBJECTS[id];
    if (!o) return;
    $("sheet-title").textContent = o.title;
    $("sheet-meta").textContent = o.meta;
    $("sheet-body").innerHTML = o.body;
    $("sheet-hint").textContent = o.hint;
    $("loupe").classList.add("on");
    $("loupe").setAttribute("data-current", id);

    if (o.birthday && STATE.found.indexOf(id) < 0 && STATE.phase === "search") {
      STATE.found.push(id);
      $(id).classList.add("found");
      $("foundcount").textContent = STATE.found.length;
      if (STATE.found.length === BIRTHDAY.length) {
        $("crttext").textContent = "U-114\n验证期 第 1 天\n────────────────\n检索完成。\n门口有脚步声。";
      }
    }
  }

  function closeLoupe() {
    $("loupe").classList.remove("on");
    if (STATE.found.length === BIRTHDAY.length && STATE.phase === "search") {
      STATE.phase = "meet";
      setTimeout(startMeet, 500);
    }
  }

  /* ---------------- 小满的五问 ---------------- */
  var QUESTIONS = [
    { q: "爸爸，你昨天是不是又加班了？",
      chips: [
        { t: "没有，我回来得很早。", safe: false, note: "与台历矛盾：昨天那一页写着「21:40 离开公司」。", drift: 6 },
        { t: "……（不回答，看着她）", safe: true, note: "他习惯在回答前停两拍。她认得这个停顿。" },
        { t: "你怎么知道？妈妈说的？", safe: false, note: "他从不用反问句对她说话。", drift: 9 }
      ] },
    { q: "你还弹吉他吗？",
      chips: [
        { t: "还弹。", safe: true, note: "第 3 天你说过同一句话。这两句必须一直一致。" },
        { t: "好久没弹了。", safe: false, note: "与小满的记忆冲突，但她反而松了一口气。", drift: 5 },
        { t: "你想听吗？我给你弹一段。", safe: false, note: "储物间的吉他**没有弦**。她在门口站着，等着。", drift: 12 }
      ] },
    { q: "妈妈说你这周有点不一样。",
      chips: [
        { t: "哪儿不一样？", safe: true, note: "他把问题接住了，没有否认也没有解释。" },
        { t: "没有不一样。", safe: false, note: "否认得太快了。她低下头，不再看你。", drift: 7 },
        { t: "工作的事，别管。", safe: false, note: "他从不用「别管」这两个字对她说话。", drift: 10 }
      ] },
    { trap: true, q: "爸爸，昨天那个蛋糕，是给我的吗？",
      chips: [
        { t: "是。十一根蜡烛，不要数字的那种。", safe: null, note: "你说对了细节。而细节只能来自那张订单 —— 她没给你看过订单。" },
        { t: "你怎么知道有蛋糕？", safe: null, note: "她愣了一下：「我看见了呀。」—— 你本可以说得更好。" },
        { t: "……（点头）", safe: null, note: "她笑了。她没有再问。你不知道自己刚才答对了什么。" }
      ] },
    { q: "爸爸，你会一直在吗？",
      chips: [
        { t: "会。", safe: true, note: "档案里他对这句问题的原话就是这一个字。" },
        { t: "这盏灯一直亮着。", safe: false, note: "这句话是**她画在画背面的**。你不该知道。", drift: 15 },
        { t: "……", safe: false, note: "沉默太久。她数了三下，然后转身。", drift: 8 }
      ] }
  ];

  function startMeet() {
    $("meet").classList.add("on");
    STATE.qIndex = 0;
    showQuestion();
  }

  function showQuestion() {
    var q = QUESTIONS[STATE.qIndex];
    if (!q) { endMeet(); return; }
    $("meet-line").textContent = q.q;
    $("meet-who").textContent = "小满 · 11 岁" + (q.trap ? " · 这一题档案里没有答案" : " · 第 " + (STATE.qIndex + 1) + " 问");
    $("ammo").innerHTML = q.chips.map(function (c, i) {
      return '<button class="chip' + (c.safe === false ? " risky" : "") + '" data-i="' + i + '" type="button">' +
        c.t + "<small>" + (c.safe === true ? "他可能会这么说" : c.safe === false ? "风险" : "档案中无记录") + "</small></button>";
    }).join("");
  }

  function answer(i) {
    var q = QUESTIONS[STATE.qIndex];
    if (!q) return;
    var c = q.chips[i];
    if (!c) return;
    STATE.answers.push({ q: q.q, a: c.t });
    log("她说：「" + q.q + "」我说：「" + c.t + "」<br><span style='color:#8b8371;font-size:13px'>" + c.note + "</span>",
        { drift: c.drift || 0 });
    STATE.qIndex++;
    if (STATE.qIndex >= QUESTIONS.length) endMeet(); else showQuestion();
  }

  function endMeet() {
    $("meet").classList.remove("on");
    $("crttext").textContent = "U-114\n验证期 第 1 天\n────────────────\n生活会面：完成\n漂移 " + Math.round(STATE.drift) + "%";
    if (STATE.phase === "meet") { STATE.phase = "letter"; setTimeout(function () { $("letter").classList.add("on"); }, 700); }
  }

  /* ---------------- 信 ---------------- */
  function letterChoice(kept) {
    $("letter").classList.remove("on");
    log(kept ? "我把那封信收进了抽屉最里面。" : "我把那封信撕了，碎片冲进了水槽。",
        { drift: kept ? 0 : 4 });
    STATE.phase = "audit";
    setTimeout(runAudit, 600);
  }

  /* ---------------- 审计：针式打印机 ---------------- */
  function runAudit() {
    var out = $("printout");
    out.innerHTML = "";
    $("audit").classList.add("on");
    var lines = [
      "MERIDIAN 连续性服务 / HALO CARE 转呈",
      "────────────────────────────────",
      "档案：U-114　　原件：叶·原　　验证期：第 1 天",
      "检索：完成（3/3）",
      "生活会面：完成（5/5）",
      "未授权通信：检测到 1 件",
      "────────────────────────────────",
      "漂移值：<span class='drift'>" + Math.round(STATE.drift) + "%</span>",
      "结论：<b>" + (STATE.drift < 30 ? "在容许范围内。继续。" : "超出容许范围。已记录。") + "</b>",
      "",
      "您的验证期仍在进行中。感谢您的配合。"
    ];
    var i = 0;
    (function tick() {
      if (i < lines.length) {
        out.innerHTML += lines[i] + "<br>";
        i++;
        setTimeout(tick, 190);
      } else {
        out.innerHTML += "<div class='warn'>检测到一件不在训练集内的物品。请勿触碰。</div>" +
          "<div class='next'><button id='again' type='button'>回到书房</button></div>";
        var again = $("again");
        if (again) again.addEventListener("click", closeAudit);
      }
    })();
  }

  function closeAudit() {
    $("audit").classList.remove("on");
    STATE.phase = "done";
    $("crttext").textContent = "U-114\n验证期 第 1 天\n────────────────\n桌上多了一样东西。\n不在训练集内。";
    // 桌上多出一个笔记本
    if (!$("notebook")) {
      var nb = document.createElement("div");
      nb.className = "obj";
      nb.id = "notebook";
      nb.setAttribute("role", "button");
      nb.setAttribute("tabindex", "0");
      nb.style.cssText = "left:60%;bottom:4%;width:96px;height:70px;background:#4b3a2a;transform:rotate(-6deg);box-shadow:0 6px 16px rgba(0,0,0,.6)";
      nb.innerHTML = '<u style="position:absolute;inset:6px;background:repeating-linear-gradient(180deg,rgba(231,224,207,.28) 0 1px,transparent 1px 9px)"></u><span class="label">笔记本</span>';
      document.querySelector(".desk").appendChild(nb);
      nb.addEventListener("click", function () {
        log("我翻开了那本笔记本。第一页只有一行字：<b>「你已经读到这行了。」</b>", { drift: 0 });
        inspectNote();
      });
    }
  }

  function inspectNote() {
    $("sheet-title").textContent = "笔记本";
    $("sheet-meta").textContent = "硬皮 · 141 页 · 字迹与档案中的他不完全一致";
    $("sheet-body").innerHTML = "<p>第一页：<b>「你已经读到这行了。」</b></p>" +
      "<p>第二页到一百四十页是空的 —— 但纸张有压痕，说明曾经写过字，然后被擦掉了。</p>" +
      "<p>最后一页右下角，有一行非常小的铅笔字，属于**另一个人的笔迹**：<b>「U-115，轮到你了。」</b></p>";
    $("sheet-hint").textContent = "他知道会有下一具。";
    $("loupe").classList.add("on");
    $("loupe").setAttribute("data-current", "notebook");
  }

  /* ---------------- 声音：复用站点的合成引擎 ---------------- */
  function toggleSound() {
    var btn = $("sound");
    try {
      if (!window.ATTMusic) { btn.textContent = "声音：不可用"; return; }
      if (!STATE.sound) {
        window.ATTMusic.selectTrack("lofi");     // 无鼓点、无杂音、可无限循环的铺底
        window.ATTMusic.start();
        STATE.sound = true; btn.textContent = "声音：开";
      } else {
        window.ATTMusic.stop();
        STATE.sound = false; btn.textContent = "声音：关";
      }
    } catch (e) { btn.textContent = "声音：不可用"; }
  }

  /* ---------------- 事件绑定 ---------------- */
  Object.keys(OBJECTS).forEach(function (id) {
    var el = $(id);
    if (!el) return;
    el.addEventListener("click", function () { inspect(id); });
    el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inspect(id); } });
  });
  $("loupeclose").addEventListener("click", closeLoupe);
  $("loupe").addEventListener("click", function (e) { if (e.target === $("loupe")) closeLoupe(); });
  $("ammo").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if (!b) return;
    answer(parseInt(b.getAttribute("data-i"), 10));
  });
  $("tear").addEventListener("click", function () { letterChoice(false); });
  $("keep").addEventListener("click", function () { letterChoice(true); });
  $("openledger").addEventListener("click", function () { $("ledger").classList.toggle("on"); });
  $("closeledger").addEventListener("click", function () { $("ledger").classList.remove("on"); });
  $("sound").addEventListener("click", toggleSound);
  $("driftup").addEventListener("click", function () { STATE.drift = Math.min(100, STATE.drift + 20); renderLedger(); });
  $("reset").addEventListener("click", function () { location.reload(); });
  $("repair").addEventListener("click", function () {
    if (STATE.budget <= 0 || !STATE.entries.length) return;
    var last = STATE.entries[STATE.entries.length - 1];
    if (last.repaired) return;
    last.repaired = true;
    STATE.budget--;
    STATE.drift = Math.max(0, STATE.drift - 4);
    renderLedger();
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "l" || e.key === "L") $("ledger").classList.toggle("on");
    if (e.key === "Escape") closeLoupe();
  });

  renderLedger();

  /* ---------------- 给自动化测试用的接口 ---------------- */
  window.__game = {
    state: function () {
      return { day: STATE.day, drift: Math.round(STATE.drift), found: STATE.found.slice(),
               phase: STATE.phase, entries: STATE.entries.length, answers: STATE.answers.length,
               hand: handFor(), budget: STATE.budget };
    },
    objects: function () { return Object.keys(OBJECTS); },
    inspect: inspect,
    closeLoupe: closeLoupe,
    answer: answer,
    letter: letterChoice,
    audit: runAudit,
    closeAudit: closeAudit,
    pushDrift: function (n) { STATE.drift = Math.min(100, STATE.drift + (n || 20)); renderLedger(); },
    ledgerText: function () { return (document.getElementById("pages") || {}).textContent || ""; }
  };
})();
</script>
</body>
</html>
