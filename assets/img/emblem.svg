<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="The Attachment Too Large Society — bronze and gold laurel medallion">
  <title>Attachment Too Large Society — laurel medallion, MMXXVI</title>
  <defs>
    <radialGradient id="field" cx="40%" cy="34%" r="74%">
      <stop offset="0" stop-color="#f5eeda"/>
      <stop offset="0.55" stop-color="#e9e0c6"/>
      <stop offset="0.86" stop-color="#d9cda9"/>
      <stop offset="1" stop-color="#c3b389"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#a88a52"/>
      <stop offset="0.42" stop-color="#7d6435"/>
      <stop offset="1" stop-color="#54421f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e8cd83"/>
      <stop offset="0.35" stop-color="#c9a961"/>
      <stop offset="0.62" stop-color="#8f7434"/>
      <stop offset="1" stop-color="#e0c179"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4a2c"/>
      <stop offset="0.5" stop-color="#3b2f1c"/>
      <stop offset="1" stop-color="#241d11"/>
    </linearGradient>
    <path id="arcTop" d="M 132 400 A 268 268 0 0 1 668 400" fill="none"/>
    <path id="arcBottom" d="M 176 400 A 224 224 0 0 0 624 400" fill="none"/>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>

  <circle cx="400" cy="400" r="394" fill="url(#ring)"/>
  <circle cx="400" cy="400" r="388" fill="none" stroke="url(#gold)" stroke-width="1.6"/>
  <circle cx="400" cy="400" r="374" fill="url(#field)"/>
  <circle cx="400" cy="400" r="374" fill="none" stroke="#4a3a20" stroke-width="2.4"/>

  <!-- 希腊回纹（meander）边饰：用 dasharray 排出一圈方齿 -->
  <circle cx="400" cy="400" r="352" fill="none" stroke="url(#bronze)" stroke-width="12"
          stroke-dasharray="10 10" opacity="0.42"/>
  <circle cx="400" cy="400" r="340" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85"/>
  <circle cx="400" cy="400" r="326" fill="none" stroke="url(#bronze)" stroke-width="1.2" opacity="0.6"/>

  <!-- 环形铭文 -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="31" letter-spacing="12.5"
        fill="url(#bronze)" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">ATTACHMENT TOO LARGE</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="4"
        fill="url(#bronze)" text-anchor="middle" x="400" y="586">MMXXVI</text>

  <!-- 桂冠：左右各一枝，青铜叶 + 金脉 -->
  <g stroke-linecap="round" fill="none">
    <!-- 左枝 -->
    <path d="M 400 604 C 322 596 262 542 246 462 C 232 392 258 330 300 290"
          stroke="url(#bronze)" stroke-width="7"/>
    <!-- 右枝 -->
    <path d="M 400 604 C 478 596 538 542 554 462 C 568 392 542 330 500 290"
          stroke="url(#bronze)" stroke-width="7"/>
  </g>
  <g fill="url(#bronze)" stroke="url(#gold)" stroke-width="1.1">
    <!-- 左叶：由下往上，角度渐变 -->
    <ellipse cx="330" cy="576" rx="15" ry="34" transform="rotate(-52 330 576)"/>
    <ellipse cx="300" cy="540" rx="15" ry="35" transform="rotate(-42 300 540)"/>
    <ellipse cx="276" cy="498" rx="15" ry="36" transform="rotate(-32 276 498)"/>
    <ellipse cx="260" cy="452" rx="15" ry="36" transform="rotate(-22 260 452)"/>
    <ellipse cx="254" cy="404" rx="15" ry="35" transform="rotate(-10 254 404)"/>
    <ellipse cx="258" cy="356" rx="14" ry="33" transform="rotate(4 258 356)"/>
    <ellipse cx="272" cy="314" rx="13" ry="30" transform="rotate(20 272 314)"/>
    <!-- 右叶 -->
    <ellipse cx="470" cy="576" rx="15" ry="34" transform="rotate(52 470 576)"/>
    <ellipse cx="500" cy="540" rx="15" ry="35" transform="rotate(42 500 540)"/>
    <ellipse cx="524" cy="498" rx="15" ry="36" transform="rotate(32 524 498)"/>
    <ellipse cx="540" cy="452" rx="15" ry="36" transform="rotate(22 540 452)"/>
    <ellipse cx="546" cy="404" rx="15" ry="35" transform="rotate(10 546 404)"/>
    <ellipse cx="542" cy="356" rx="14" ry="33" transform="rotate(-4 542 356)"/>
    <ellipse cx="528" cy="314" rx="13" ry="30" transform="rotate(-20 528 314)"/>
  </g>
  <!-- 叶脉：每片叶上一道金线 -->
  <g stroke="url(#gold)" stroke-width="1.1" opacity="0.8">
    <path d="M 322 600 L 338 552 M 292 562 L 308 518 M 268 520 L 284 476 M 252 474 L 268 430 M 246 426 L 262 384 M 250 378 L 266 336 M 264 336 L 280 296"/>
    <path d="M 478 600 L 462 552 M 508 562 L 492 518 M 532 520 L 516 476 M 548 474 L 532 430 M 554 426 L 538 384 M 550 378 L 534 336 M 536 336 L 520 296"/>
  </g>
  <!-- 顶部金环（桂冠束带） -->
  <path d="M 300 290 C 340 268 460 268 500 290" stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 底部缎带结 -->
  <path d="M 400 604 C 384 616 366 626 344 632 M 400 604 C 416 616 434 626 456 632"
        stroke="url(#gold)" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 中央：青铜回形针（金边） -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 357 540 L 357 300 A 43 43 0 0 1 443 300 L 443 560" stroke="url(#bronze)" stroke-width="16"/>
    <path d="M 381 300 A 19 19 0 0 1 419 300 L 419 538" stroke="url(#gold)" stroke-width="11"/>
    <path d="M 357 300 L 443 300" stroke="url(#gold)" stroke-width="10"/>
    <path d="M 443 560 A 11 11 0 0 1 422 560" stroke="url(#bronze)" stroke-width="11"/>
  </g>

  <circle cx="400" cy="400" r="374" filter="url(#grain)" opacity="0.45"/>
  <circle cx="400" cy="400" r="374" fill="none" stroke="#3a2f21" stroke-width="24" opacity="0.10"/>
</svg>
