<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="The Attachment Too Large Society — a struck bronze medallion, verdigris and gold">
  <title>Attachment Too Large Society — bronze medallion with verdigris patina and a gold laurel wreath</title>
  <defs>
    <!-- 铜绿：氧化青铜的主色，中心偏亮、边缘沉下去 -->
    <radialGradient id="patina" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#4e9c82"/>
      <stop offset="0.34" stop-color="#357a63"/>
      <stop offset="0.66" stop-color="#245c4a"/>
      <stop offset="0.88" stop-color="#174034"/>
      <stop offset="1" stop-color="#0e2b23"/>
    </radialGradient>
    <!-- 铜绿斑驳：让表面像真的氧化过 -->
    <radialGradient id="bloom" cx="62%" cy="72%" r="52%">
      <stop offset="0" stop-color="#7fc4a6" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#3f8a70" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#12352b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="24%" cy="76%" r="44%">
      <stop offset="0" stop-color="#2f7f68" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#12352b" stop-opacity="0"/>
    </radialGradient>
    <!-- 黄金：带金属扫光的渐变 -->
    <linearGradient id="gold" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#f3e0a8"/>
      <stop offset="0.18" stop-color="#d9b968"/>
      <stop offset="0.42" stop-color="#a9862f"/>
      <stop offset="0.6" stop-color="#e2c47c"/>
      <stop offset="0.8" stop-color="#b08f38"/>
      <stop offset="1" stop-color="#f0d894"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e9bd"/>
      <stop offset="0.5" stop-color="#b8933c"/>
      <stop offset="1" stop-color="#7d6120"/>
    </linearGradient>
    <!-- 章体侧面（冲压的厚度） -->
    <linearGradient id="edge" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2b6a56"/>
      <stop offset="0.38" stop-color="#123a2f"/>
      <stop offset="0.72" stop-color="#0a241d"/>
      <stop offset="1" stop-color="#2f7f68"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#04120e" flood-opacity="0.55"/>
    </filter>
    <filter id="oxide" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.05" numOctaves="4" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in"/>
    </filter>
    <path id="arcTop" d="M 138 400 A 262 262 0 0 1 662 400" fill="none"/>
    <!-- 一片桂叶：两头收尖，带中脉。沿枝条用 use 复用 20 次 -->
    <g id="leaf">
      <path d="M 0 0 C 12 -10 19 -27 0 -42 C -19 -27 -12 -10 0 0 Z"
            fill="url(#gold)" stroke="#7d6120" stroke-width="0.9"/>
      <path d="M 0 -3 L 0 -37" stroke="#6f5518" stroke-width="1" opacity="0.55" fill="none"/>
    </g>
    <path id="arcBtm" d="M 210 400 A 190 190 0 0 0 590 400" fill="none"/>
  </defs>

  <!-- 落影 + 章体侧面 -->
  <g filter="url(#drop)">
    <circle cx="400" cy="400" r="382" fill="url(#edge)"/>
  </g>
  <circle cx="400" cy="400" r="382" fill="url(#edge)"/>
  <circle cx="400" cy="400" r="382" fill="none" stroke="#061a15" stroke-width="2"/>
  <!-- 顶缘高光 / 底缘暗线，做出厚度 -->
  <path d="M 118 250 A 382 382 0 0 1 682 250" fill="none" stroke="#6ec3a2" stroke-width="4" opacity="0.35"/>
  <path d="M 150 590 A 382 382 0 0 0 650 590" fill="none" stroke="#04120e" stroke-width="6" opacity="0.5"/>

  <!-- 章面 -->
  <circle cx="400" cy="400" r="356" fill="url(#patina)"/>
  <circle cx="400" cy="400" r="356" fill="url(#bloom)"/>
  <circle cx="400" cy="400" r="356" fill="url(#bloom2)"/>
  <circle cx="400" cy="400" r="356" filter="url(#oxide)" opacity="0.22"/>
  <circle cx="400" cy="400" r="356" fill="url(#sheen)"/>

  <!-- 珠边（beaded ring）：一排小金珠 -->
  <circle cx="400" cy="400" r="334" fill="none" stroke="url(#gold)" stroke-width="13"
          stroke-dasharray="0.1 20.5" stroke-linecap="round" opacity="0.95"/>
  <circle cx="400" cy="400" r="348" fill="none" stroke="url(#goldEdge)" stroke-width="1.6" opacity="0.8"/>
  <circle cx="400" cy="400" r="322" fill="none" stroke="url(#goldEdge)" stroke-width="1.2" opacity="0.55"/>

  <!-- 环形铭文 -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="36" letter-spacing="13"
        fill="url(#gold)" text-anchor="middle" stroke="#0b241d" stroke-width="0.7" paint-order="stroke">
    <textPath href="#arcTop" startOffset="50%">ATTACHMENT TOO LARGE</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="7"
        fill="url(#goldEdge)" text-anchor="middle" x="400" y="704">ΕΤΑΙΡΕΙΑ · MMXXVI</text>

  <!-- 桂冠：两枝，各十叶（尖叶，中脉），叶间留白 -->
  <g fill="none" stroke="url(#gold)" stroke-linecap="round">
    <path d="M 400 596 C 316 588 250 528 236 442 C 224 366 254 300 302 258" stroke-width="6.5"/>
    <path d="M 400 596 C 484 588 550 528 564 442 C 576 366 546 300 498 258" stroke-width="6.5"/>
  </g>
  <g>
    <use href="#leaf" transform="translate(332 578) rotate(-62)"/>
    <use href="#leaf" transform="translate(302 543) rotate(-52)"/>
    <use href="#leaf" transform="translate(278 502) rotate(-41)"/>
    <use href="#leaf" transform="translate(261 457) rotate(-29)"/>
    <use href="#leaf" transform="translate(251 410) rotate(-16)"/>
    <use href="#leaf" transform="translate(250 362) rotate(-3)"/>
    <use href="#leaf" transform="translate(258 315) rotate(11)"/>
    <use href="#leaf" transform="translate(274 272) rotate(26)"/>
    <use href="#leaf" transform="translate(298 235) rotate(41)"/>
    <use href="#leaf" transform="translate(326 207) rotate(55)"/>
    <use href="#leaf" transform="translate(468 578) rotate(62)"/>
    <use href="#leaf" transform="translate(498 543) rotate(52)"/>
    <use href="#leaf" transform="translate(522 502) rotate(41)"/>
    <use href="#leaf" transform="translate(539 457) rotate(29)"/>
    <use href="#leaf" transform="translate(549 410) rotate(16)"/>
    <use href="#leaf" transform="translate(550 362) rotate(3)"/>
    <use href="#leaf" transform="translate(542 315) rotate(-11)"/>
    <use href="#leaf" transform="translate(526 272) rotate(-26)"/>
    <use href="#leaf" transform="translate(502 235) rotate(-41)"/>
    <use href="#leaf" transform="translate(474 207) rotate(-55)"/>
  </g>
  <!-- 顶部束带与底部缎带 -->
  <path d="M 302 258 C 344 232 456 232 498 258" stroke="url(#gold)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 400 596 C 380 612 358 624 330 632 M 400 596 C 420 612 442 624 470 632"
        stroke="url(#goldEdge)" stroke-width="5.5" fill="none" stroke-linecap="round"/>

  <!-- 中央：黄金回形针，带柔和的雕刻阴影 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(3 4)">
    <path d="M 359 520 L 359 296 A 41 41 0 0 1 441 296 L 441 544" stroke="#0a2019" stroke-width="17" opacity="0.4"/>
    <path d="M 382 296 A 18 18 0 0 1 418 296 L 418 522" stroke="#0a2019" stroke-width="12" opacity="0.32"/>
  </g>
  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 359 520 L 359 296 A 41 41 0 0 1 441 296 L 441 544" stroke-width="16"/>
    <path d="M 382 296 A 18 18 0 0 1 418 296 L 418 522" stroke-width="11"/>
    <path d="M 359 296 L 441 296" stroke-width="10"/>
    <path d="M 441 544 A 11 11 0 0 1 420 544" stroke-width="11"/>
  </g>
  <!-- 回形针上的高光 -->
  <path d="M 366 500 L 366 300" stroke="#f8eecb" stroke-width="2.4" opacity="0.5" fill="none"/>
  <path d="M 390 320 L 390 500" stroke="#f8eecb" stroke-width="1.6" opacity="0.35" fill="none"/>

  <!-- 边缘暗角，收住整枚章 -->
  <circle cx="400" cy="400" r="356" fill="none" stroke="#08201a" stroke-width="30" opacity="0.28"/>
  <circle cx="400" cy="400" r="356" fill="none" stroke="#7fc4a6" stroke-width="1.4" opacity="0.35"/>
</svg>
