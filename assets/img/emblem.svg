<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="The Attachment Too Large Society medal">
  <title>Attachment Too Large Society — society medal, MMXXVI</title>
  <defs>
    <!-- 陈年象牙底：中心略亮，边缘发暗，模仿磨旧的金属 -->
    <radialGradient id="face" cx="42%" cy="36%" r="72%">
      <stop offset="0" stop-color="#f2ecdd"/>
      <stop offset="0.55" stop-color="#e7dfcc"/>
      <stop offset="0.85" stop-color="#dbd1b9"/>
      <stop offset="1" stop-color="#cbbfa3"/>
    </radialGradient>
    <!-- 青铜：刻线用 -->
    <linearGradient id="bronze" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8d7650"/>
      <stop offset="0.45" stop-color="#6f5c3c"/>
      <stop offset="1" stop-color="#54452c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a3d2b"/>
      <stop offset="0.5" stop-color="#332a1e"/>
      <stop offset="1" stop-color="#241d13"/>
    </linearGradient>
    <!-- 环形文字的路径：从左到右沿上半圆 -->
    <path id="arcTop" d="M 118 400 A 282 282 0 0 1 682 400" fill="none"/>
    <!-- 极细的纸纹颗粒 -->
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
    </filter>
  </defs>

  <!-- 章体：外深环 + 细内线 -->
  <circle cx="400" cy="400" r="392" fill="url(#rim)"/>
  <circle cx="400" cy="400" r="386" fill="none" stroke="#6b5a3e" stroke-width="1.2" opacity="0.75"/>
  <circle cx="400" cy="400" r="372" fill="url(#face)"/>
  <circle cx="400" cy="400" r="372" fill="none" stroke="#4f4130" stroke-width="2"/>

  <!-- 刻度圈：用 dasharray 做出 155 根刻度线 -->
  <circle cx="400" cy="400" r="352" fill="none" stroke="url(#bronze)" stroke-width="9"
          stroke-dasharray="2.6 12" opacity="0.5"/>
  <circle cx="400" cy="400" r="336" fill="none" stroke="url(#bronze)" stroke-width="1.4" opacity="0.75"/>

  <!-- 两侧小星（9 点与 3 点方向） -->
  <g fill="url(#bronze)" opacity="0.95">
    <path d="M 92 400 l 5 9 10 1.4 -7.2 7 1.8 10 -9.6 -5 -9.6 5 1.8 -10 -7.2 -7 10 -1.4 z"/>
    <path d="M 708 400 l 5 9 10 1.4 -7.2 7 1.8 10 -9.6 -5 -9.6 5 1.8 -10 -7.2 -7 10 -1.4 z"/>
  </g>

  <!-- 环形大写标题 -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="35" letter-spacing="13.5"
        fill="url(#bronze)" text-anchor="middle">
    <textPath href="#arcTop" startOffset="50%">ATTACHMENT TOO LARGE</textPath>
  </text>

  <!-- 中央虚线圆 -->
  <circle cx="400" cy="400" r="206" fill="none" stroke="url(#bronze)" stroke-width="1.7"
          stroke-dasharray="7 8" opacity="0.85"/>

  <!-- 中央：竖向雕刻回形针（外环 + 内环 + 顶部横桥 + 底部小钩） -->
  <g fill="none" stroke="url(#bronze)" stroke-linecap="round" stroke-linejoin="round">
    <!-- 外环 -->
    <path d="M 349 596 L 349 262 A 51 51 0 0 1 451 262 L 451 622" stroke-width="15"/>
    <!-- 内环 -->
    <path d="M 377 262 A 23 23 0 0 1 423 262 L 423 596" stroke-width="13"/>
    <!-- 顶部横桥 -->
    <path d="M 349 262 L 451 262" stroke-width="11"/>
    <!-- 底部小钩 -->
    <path d="M 451 622 A 13 13 0 0 1 425 622" stroke-width="13"/>
  </g>
  <!-- 刻线的阴影：让回形针看起来是压进金属里的 -->
  <g fill="none" stroke="#2b241a" stroke-linecap="round" stroke-opacity="0.22" stroke-width="2">
    <path d="M 352 604 L 352 264"/>
    <path d="M 454 268 L 454 624"/>
  </g>

  <!-- 年份 -->
  <text x="400" y="690" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="30" letter-spacing="4.5" fill="url(#bronze)">MMXXVI</text>

  <!-- 纸纹与边缘暗角 -->
  <circle cx="400" cy="400" r="372" filter="url(#grain)" opacity="0.5"/>
  <circle cx="400" cy="400" r="372" fill="none" stroke="#3a2f21" stroke-width="26" opacity="0.10"/>
</svg>
