<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 820" role="img" aria-label="A Greek hoplite, drawn the way a pot painter would have: crested helmet, round shield, spear">
  <title>Hoplite — red-figure style, shield bearing the society's paperclip</title>
  <defs>
    <linearGradient id="clay" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#d2703f"/>
      <stop offset="0.55" stop-color="#b4553c"/>
      <stop offset="1" stop-color="#8f3d2b"/>
    </linearGradient>
    <linearGradient id="clayDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a34a30"/>
      <stop offset="1" stop-color="#7d3323"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9c58a"/>
      <stop offset="0.5" stop-color="#a98a45"/>
      <stop offset="1" stop-color="#7d6128"/>
    </linearGradient>
  </defs>

  <!-- 地面投影 -->
  <ellipse cx="320" cy="784" rx="230" ry="22" fill="#0a0a0c" opacity="0.1"/>

  <g stroke="#0a0a0c" stroke-linejoin="round" stroke-linecap="round">

    <!-- ============ 长矛：从左下斜穿到右上，矛尖在右上 ============ -->
    <path d="M 60 700 L 520 210" stroke="#0a0a0c" stroke-width="9"/>
    <path d="M 516 214 L 566 158 L 548 208 L 528 226 Z" fill="url(#bronze)" stroke-width="6"/>
    <path d="M 70 690 L 44 728 L 84 706 Z" fill="url(#bronze)" stroke-width="5"/>

    <!-- ============ 后腿（向后蹬直） ============ -->
    <path d="M 292 520 C 258 566 224 610 196 650
             L 176 704 C 170 718 178 730 192 732
             L 226 730 C 238 728 244 720 246 710
             L 262 662 C 292 626 330 578 352 540 Z"
          fill="url(#clayDark)" stroke-width="7"/>
    <!-- 后脚 -->
    <path d="M 174 706 C 152 716 128 726 122 738 C 120 748 130 754 144 754
             L 232 752 C 242 752 246 742 240 736 L 200 726 Z"
          fill="url(#clay)" stroke-width="6"/>

    <!-- ============ 前腿（屈膝向前） ============ -->
    <path d="M 366 512 C 392 552 416 594 428 636
             L 442 692 C 446 706 454 714 470 716
             L 506 714 C 518 712 522 700 516 690
             L 486 640 C 470 596 442 548 418 508 Z"
          fill="url(#clay)" stroke-width="7"/>
    <!-- 前脚与凉鞋带 -->
    <path d="M 440 694 C 464 704 494 716 512 728 C 520 736 514 748 502 748
             L 428 746 C 418 746 414 736 420 730 L 438 720 Z"
          fill="url(#clay)" stroke-width="6"/>
    <path d="M 452 706 L 486 730 M 466 700 L 500 724" stroke-width="5"/>

    <!-- ============ 胫甲（青铜，覆盖小腿） ============ -->
    <path d="M 424 604 C 442 626 452 650 456 676 L 442 690 C 430 664 418 640 408 620 Z"
          fill="url(#bronze)" stroke-width="6"/>
    <path d="M 214 640 C 224 664 232 686 236 706 L 220 712 C 212 690 200 666 192 646 Z"
          fill="url(#bronze)" stroke-width="6" opacity="0.9"/>

    <!-- ============ 披风（自肩后垂下并向外扬起） ============ -->
    <path d="M 300 236 C 236 268 190 336 178 412
             C 168 480 184 552 214 610
             C 196 540 196 462 220 400
             C 246 334 292 288 340 268 Z"
          fill="url(#clayDark)" stroke-width="7"/>

    <!-- ============ 战裙（皮条 pteruges） ============ -->
    <path d="M 300 402 L 396 402 L 404 486 C 396 500 380 506 366 500
             L 356 470 L 346 506 C 332 512 316 506 310 494
             L 302 466 L 292 500 C 278 506 262 498 258 484 Z"
          fill="url(#clayDark)" stroke-width="6"/>
    <path d="M 322 414 L 320 486 M 352 414 L 350 490 M 380 414 L 380 486" stroke-width="4" opacity="0.55"/>

    <!-- ============ 躯干与青铜胸甲 ============ -->
    <path d="M 302 240 C 350 240 388 268 398 312
             L 402 402 L 296 402 L 292 320 C 272 306 276 258 302 240 Z"
          fill="url(#clay)" stroke-width="7"/>
    <path d="M 300 262 C 342 258 380 282 392 320
             L 396 396 L 300 396 Z" fill="url(#bronze)" stroke-width="6"/>
    <path d="M 320 292 C 342 300 362 316 374 338" stroke-width="4" opacity="0.5" fill="none"/>
    <path d="M 320 330 C 342 338 362 354 374 376" stroke-width="4" opacity="0.5" fill="none"/>

    <!-- ============ 右臂（持矛，向前下方伸出） ============ -->
    <path d="M 372 280 C 404 288 428 310 440 344
             L 456 396 C 462 410 456 422 442 424
             C 430 426 420 418 416 406 L 398 352
             C 384 330 366 314 348 306 Z"
          fill="url(#clay)" stroke-width="7"/>
    <path d="M 404 268 L 448 296 L 452 342 C 450 356 436 360 428 350 L 408 310 Z"
          fill="url(#bronze)" stroke-width="6"/>

    <!-- ============ 左臂 + 大圆盾（aspis） ============ -->
    <circle cx="212" cy="452" r="150" fill="url(#bronze)" stroke-width="8"/>
    <circle cx="212" cy="452" r="132" fill="#1d2b23" stroke-width="6"/>
    <circle cx="212" cy="452" r="118" fill="none" stroke="#a98a45" stroke-width="3" opacity="0.7"/>
    <!-- 盾徽：组织的回形针，画成陶器上的红绘 -->
    <g transform="translate(212 452) rotate(-14)">
      <path d="M -22 -58 L -22 40 A 22 22 0 0 0 22 40 L 22 -46"
            fill="none" stroke="#c8532f" stroke-width="15" stroke-linecap="round"/>
      <path d="M -4 -58 A 9 9 0 0 1 14 -58 L 14 30"
            fill="none" stroke="#c8532f" stroke-width="11" stroke-linecap="round"/>
    </g>
    <!-- 盾缘铆钉 -->
    <g fill="#d9c58a" stroke="none">
      <circle cx="212" cy="312" r="4"/><circle cx="212" cy="592" r="4"/>
      <circle cx="72" cy="452" r="4"/><circle cx="352" cy="452" r="4"/>
      <circle cx="114" cy="354" r="4"/><circle cx="310" cy="550" r="4"/>
      <circle cx="310" cy="354" r="4"/><circle cx="114" cy="550" r="4"/>
    </g>

    <!-- ============ 头盔（科林斯式）+ 黑白盔冠 ============ -->
    <!-- 盔冠：自前向后扬起，黑底白纹 -->
    <path d="M 322 78 C 396 74 452 108 476 168
             C 488 198 488 226 482 246
             C 452 208 414 182 372 168
             C 344 158 326 122 322 78 Z"
          fill="#0a0a0c" stroke-width="7"/>
    <g stroke="#f2f1ec" stroke-width="5" opacity="0.9" fill="none">
      <path d="M 340 96 C 400 104 444 136 466 186"/>
      <path d="M 336 122 C 392 132 434 164 456 210"/>
    </g>
    <path d="M 300 176 C 306 142 336 118 372 118 C 408 118 436 142 442 176
             C 414 162 388 156 362 156 C 336 156 318 164 300 176 Z"
          fill="url(#bronze)" stroke-width="6"/>
    <!-- 盔体 -->
    <path d="M 362 150
             C 306 150 272 190 272 246
             C 272 292 286 330 310 358
             L 310 404
             C 310 428 324 444 344 444
             L 392 444
             C 412 444 426 428 426 404
             L 426 356
             C 450 330 464 292 464 248
             C 464 190 424 150 362 150 Z"
          fill="url(#bronze)" stroke-width="7"/>
    <!-- 面甲开口与鼻梁 -->
    <path d="M 300 268 C 320 256 342 254 352 264
             C 350 300 336 328 318 342
             C 304 332 298 302 300 268 Z" fill="#0a0a0c" stroke="none"/>
    <path d="M 358 258 C 378 254 396 258 406 268
             C 406 302 396 330 380 342
             C 366 328 358 298 358 258 Z" fill="#0a0a0c" stroke="none"/>
    <path d="M 352 250 L 368 250 L 368 356 C 362 368 356 368 350 356 Z"
          fill="url(#bronze)" stroke-width="6"/>
    <path d="M 380 372 C 392 386 396 402 392 414 C 384 404 376 388 372 378 Z"
          fill="url(#clay)" stroke-width="5"/>
    <!-- 护颊下沿 -->
    <path d="M 310 404 C 324 420 336 430 350 434 C 366 430 380 420 392 404"
          fill="none" stroke-width="5" opacity="0.6"/>

    <!-- ============ 腰带 ============ -->
    <path d="M 296 396 L 404 396 L 404 416 L 296 416 Z" fill="#0a0a0c" stroke-width="4"/>
  </g>
</svg>
