<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-label="A segmented dial of black wedges with a standing green crystal over a grey rock, on a grey field">
  <title>Terminal dial — black graduated wedges, standing crystal, grey field</title>
  <defs>
    <!-- white hairline graduations printed on the black wedges -->
    <pattern id="grad" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="14" height="14" fill="#17191b"/>
      <rect x="0" y="0" width="2.4" height="14" fill="#f2f2ef" opacity="0.92"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#17191b"/>
      <rect x="5" y="5" width="9" height="9" fill="#efefec"/>
    </pattern>
    <linearGradient id="crystal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#eaf9a8"/>
      <stop offset="0.28" stop-color="#c3e455"/>
      <stop offset="0.6" stop-color="#7ba62a"/>
      <stop offset="0.85" stop-color="#3f6412"/>
      <stop offset="1" stop-color="#20360a"/>
    </linearGradient>
    <linearGradient id="crystalDark" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#2f4d0d"/>
      <stop offset="0.6" stop-color="#4d7a17"/>
      <stop offset="1" stop-color="#1a2c07"/>
    </linearGradient>
    <linearGradient id="rock" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f0f0ec"/>
      <stop offset="0.45" stop-color="#cfcfcb"/>
      <stop offset="1" stop-color="#a5a5a1"/>
    </linearGradient>
    <radialGradient id="field" cx="46%" cy="44%" r="78%">
      <stop offset="0" stop-color="#b3b3b0"/>
      <stop offset="1" stop-color="#8e8e8b"/>
    </radialGradient>
    <radialGradient id="glowBehind" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c8e84f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c8e84f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- grey field -->
  <rect width="900" height="900" fill="#a5a5a2"/>
  <!-- the thin horizon line that runs behind the crystal -->
  <g opacity="0.85">
    <rect x="0" y="298" width="900" height="2" fill="#fbfbf9"/>
    <rect x="0" y="293" width="900" height="12" fill="#ffffff" opacity="0.16"/>
  </g>
  <circle cx="470" cy="470" r="300" fill="url(#glowBehind)"/>

  <!-- ================= the dial ================= -->
  <g transform="translate(470 560)">
    <!-- graduated wedges: a fan sweeping from the upper right, round the right
         and bottom, to the lower left. Gaps between them are deliberate. -->
    <g stroke="#0d0f10" stroke-width="2">
      <path d="M 118 -196 A 228 228 0 0 1 196 -118 L 96 -58 A 112 112 0 0 0 58 -96 Z" fill="url(#grad)"/>
      <path d="M 208 -110 A 236 236 0 0 1 246 -14 L 120 -8 A 116 116 0 0 0 102 -54 Z" fill="url(#grad)"/>
      <path d="M 250 0 A 250 250 0 0 1 236 96 L 116 48 A 120 120 0 0 0 122 0 Z" fill="url(#grad)"/>
      <path d="M 232 108 A 256 256 0 0 1 178 182 L 88 90 A 126 126 0 0 0 114 54 Z" fill="url(#grad)"/>
      <path d="M 172 194 A 262 262 0 0 1 96 244 L 48 122 A 128 128 0 0 0 86 96 Z" fill="url(#grad)"/>
      <path d="M 84 252 A 266 266 0 0 1 -6 262 L -4 130 A 130 130 0 0 0 42 124 Z" fill="url(#grad)"/>
      <path d="M -18 264 A 266 266 0 0 1 -104 244 L -52 122 A 130 130 0 0 0 -8 130 Z" fill="url(#dots)"/>
      <path d="M -116 240 A 262 262 0 0 1 -186 184 L -94 92 A 128 128 0 0 0 -54 118 Z" fill="url(#dots)"/>
      <path d="M -196 176 A 256 256 0 0 1 -236 104 L -118 52 A 126 126 0 0 0 -92 88 Z" fill="url(#dots)"/>
    </g>

    <!-- lime darts scattered along the lower wedges -->
    <g fill="#c8e84f">
      <path d="M -30 92 L 0 84 L -12 108 Z"/>
      <path d="M 14 92 L 40 78 L 34 104 Z"/>
      <path d="M 44 74 L 70 58 L 68 84 Z"/>
      <path d="M -70 96 L -44 92 L -58 114 Z"/>
      <path d="M 90 26 L 116 12 L 112 38 Z"/>
    </g>

    <!-- inner hub -->
    <circle r="104" fill="#101213"/>
    <circle r="104" fill="none" stroke="#e8ece9" stroke-opacity="0.2" stroke-width="1.5"/>
    <circle r="70" fill="#191c1e"/>

    <!-- the grey faceted mass sitting in the hub -->
    <g stroke="#8f8f8b" stroke-width="1.4">
      <path d="M -78 -20 L -30 -62 L 26 -54 L 62 -14 L 54 40 L 6 66 L -48 52 Z" fill="url(#rock)"/>
      <path d="M -30 -62 L -6 -18 L 26 -54 Z" fill="#ffffff" opacity="0.55"/>
      <path d="M -6 -18 L 54 40 L 6 66 Z" fill="#b6b6b2" opacity="0.75"/>
      <path d="M -6 -18 L -78 -20 L -48 52 Z" fill="#dcdcd8" opacity="0.7"/>
      <path d="M -6 -18 L 62 -14 L 54 40 Z" fill="#c6c6c2" opacity="0.8"/>
      <path d="M -30 -62 L -6 -18 L -78 -20 Z" fill="#eaeae6" opacity="0.6"/>
      <path d="M 26 -54 L -6 -18 L 62 -14 Z" fill="#f6f6f3" opacity="0.5"/>
    </g>
    <!-- the one salmon strip crossing the mass -->
    <path d="M -92 -6 C -40 -30 30 -34 86 -12" fill="none" stroke="#e0855f" stroke-width="6" opacity="0.9"/>
  </g>

  <!-- ================= the standing crystal ================= -->
  <g transform="translate(452 300)">
    <path d="M 0 -210 L 44 -120 L 36 96 L 0 148 L -36 96 L -44 -120 Z" fill="url(#crystal)" stroke="#0e1a04" stroke-width="2.5"/>
    <path d="M 0 -210 L 44 -120 L 0 -46 Z" fill="#ffffff" opacity="0.35"/>
    <path d="M 0 -46 L -36 96 L 0 148 Z" fill="url(#crystalDark)"/>
    <path d="M 0 -196 L 0 138" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M -30 -108 L 30 -108" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M -34 30 L 34 30" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>

  <!-- ================= floating lime crosses ================= -->
  <g stroke="#c8e84f" stroke-width="6" stroke-linecap="round">
    <path d="M 168 150 L 168 196 M 145 173 L 191 173"/>
    <path d="M 742 330 L 742 372 M 721 351 L 763 351"/>
    <path d="M 208 616 L 208 656 M 188 636 L 228 636"/>
    <path d="M 700 132 L 700 162 M 685 147 L 715 147"/>
  </g>
  <g fill="#c8e84f" opacity="0.9">
    <circle cx="126" cy="252" r="9"/><circle cx="806" cy="208" r="9"/>
  </g>

  <!-- the small white mech cursor at the right -->
  <g transform="translate(812 462) scale(1.5)" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <path d="M 0 0 L 0 -26 L 8 -18 L 16 -30 L 22 -26 L 14 -14 L 24 -10 Z" fill="#ffffff"/>
  </g>
</svg>
